[project]
name = "smart-mapper"
version = "0.1.0"
description = "Maps pharmaceutical distributor customer records (Arabic names/addresses, distributor-specific codes) to the company customer master."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    "pyarabic>=0.6.15",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "click>=8.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
smart-mapper = "smart_mapper.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smart_mapper*"]
